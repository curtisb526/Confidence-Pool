name: Sync NFL odds
on:
  schedule: [{ cron: "0 */4 * * *" }]   # every 4h (~180 Odds API credits/month)
  workflow_dispatch: {}                  # Actions tab > Run workflow for a manual refresh
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install firebase-admin@12
      - run: node scripts/sync.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEEK1_START: ${{ vars.WEEK1_START }}
