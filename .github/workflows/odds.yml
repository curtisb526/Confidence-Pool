name: Sync NFL odds
on:
  schedule: [{ cron: "5 0-1,10-23 * * *" }]   # hourly window; the gate step below decides (Eastern time)
  workflow_dispatch: {}                        # manual "Run workflow" always runs
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> $GITHUB_OUTPUT; exit 0; fi
          d=$(TZ=America/New_York date +%u); h=$(TZ=America/New_York date +%-H); go=false
          case $d in
            2|3|5) [ "$h" = "10" ] && go=true ;;                                   # Tue, Wed, Fri: 10am
            1|4|6|7) case $h in 6|8|10|12|14|16|18|20) go=true ;; esac ;;          # Mon, Thu, Sat, Sun: 6am-8pm every 2h
          esac
          echo "go=$go" >> $GITHUB_OUTPUT
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - if: steps.gate.outputs.go == 'true'
        run: npm install firebase-admin@12
      - if: steps.gate.outputs.go == 'true'
        run: node scripts/sync.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEEK1_START: ${{ vars.WEEK1_START }}
