<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>NFL Pick'em</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#6b7280;--bd:#e3e6ea;--ac:#0b6b3a;--acx:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1214;--card:#181c20;--tx:#eceff2;--mu:#98a1ab;--bd:#2a3036;--ac:#3fbf78;--acx:#08150e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}h1{font-size:20px}
nav{display:flex;gap:6px;margin-bottom:12px}nav button,.side,.pts button,.btn,select{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px}
nav button{flex:1;font-weight:600}nav .on,.btn,.pts .on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.mu{color:var(--mu);font-size:13px}
.side{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;font-weight:600;background:transparent;border-width:1.5px}.side.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.side:disabled{opacity:.6;cursor:default}.pts{display:flex;gap:6px;margin-top:8px;align-items:center}.pts button{width:38px;padding:6px;font-weight:700}
.big{font-size:28px;font-weight:700}.hit{color:var(--ac);font-weight:700}.miss{color:#d92d20;font-weight:700}
.lg{width:28px;height:28px;object-fit:contain}
.hg{display:grid;gap:4px;margin-top:8px;font-size:13px}.hh{font-weight:700;text-align:center}.hl{align-self:center}
.hc{padding:6px 4px;border:1px solid var(--bd);border-radius:6px;text-align:center}
.hitbg{background:color-mix(in srgb,var(--ac) 25%,transparent)}.tot{font-weight:700;background:color-mix(in srgb,#f5d90a 30%,transparent)}
</style></head><body><main><div class="row"><h1>🏈 NFL Pick'em</h1><button class="btn" id="out" hidden>Sign out</button></div><div id="app"></div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,onSnapshot,doc,setDoc,deleteDoc,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app0=initializeApp({apiKey:"AIzaSyBlf5sNqXkX8uRVJJY6AOP06-8KB12k0Rw",authDomain:"confidencepool.firebaseapp.com",projectId:"confidencepool",appId:"1:78808055615:web:25dfc863808ed3e117dd8a"});
const auth=getAuth(app0),db=getFirestore(app0),$=s=>document.querySelector(s),A=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
let me,games=[],picks=[],names={},tab="standings",week=1;
// ---- Backfilled results (weeks 1-3). Each pick is [label, hit?] in 5/3/1 point order. ----
const PLAYERS=["Curtis","Eamonn","Steven"],PTS=[5,3,1];
const HIST={
1:{Curtis:[["Cowboys -3",0],["Ravens -3",1],["Packers +1.5",0]],Eamonn:[["Broncos +2.5",0],["Buccaneers +4",0],["Panthers +3",0]],Steven:[["Cowboys -3",0],["Ravens -3",1],["Texans +1",0]]},
2:{Curtis:[["Packers -3",0],["Panthers -2.5",1],["Bengals +2.5",1]],Eamonn:[["Commies +4",0],["Jaguars +3",0],["Texans -2.5",0]],Steven:[["Saints +8.5",1],["Packers -3",0],["Bucs -7.5",0]]},
3:{Curtis:[["49ers -7.5",0],["Chiefs -10.5",1],["Bucs +1",0]],Eamonn:[["Panthers -1.5",0],["Packers -4.5",0],["Seahawks -8.5",0]],Steven:[["Bucs +1",0],["Ravens -3.5",0],["Lions -6.5",1]]}};
// Maps a signed-in Google account to a player by the first name on the account. Add aliases here if a name doesn't match.
const who=uid=>{const n=(names[uid]||"").toLowerCase();return PLAYERS.find(p=>n.startsWith(p.toLowerCase()))||names[uid]||"Player"};
const ABBR={Cardinals:"ari",Falcons:"atl",Ravens:"bal",Bills:"buf",Panthers:"car",Bears:"chi",Bengals:"cin",Browns:"cle",Cowboys:"dal",Broncos:"den",Lions:"det",Packers:"gb",Texans:"hou",Colts:"ind",Jaguars:"jax",Chiefs:"kc",Raiders:"lv",Chargers:"lac",Rams:"lar",Dolphins:"mia",Vikings:"min",Patriots:"ne",Saints:"no",Giants:"nyg",Jets:"nyj",Eagles:"phi",Steelers:"pit","49ers":"sf",Seahawks:"sea",Buccaneers:"tb",Titans:"ten",Commanders:"wsh"};
const logo=n=>{const a=ABBR[n.split(" ").pop()];return a?`<img class="lg" alt="" src="https://a.espncdn.com/i/teamlogos/nfl/500/${a}.png" onerror="this.remove()">`:""};
const short=n=>n.split(" ").pop(),fs=n=>n>0?"+"+n:n===0?"PK":""+n;
const kms=g=>g.kickoff.toMillis(),locked=g=>Date.now()>=kms(g);
const label=(g,s,L=g.spread)=>short(s==="home"?g.home:g.away)+" "+fs(s==="home"?L:-L);
function res(g,p){if(!g.completed)return null;const m=g.hScore-g.aScore+(p.line??g.spread),v=p.side==="home"?m:-m;return v>0?"hit":v<0?"miss":"push"}
function totals(){const t={};PLAYERS.forEach(p=>t[p]=0);
  for(const w in HIST)for(const p in HIST[w])HIST[w][p].forEach(([_,hit],i)=>{if(hit)t[p]+=PTS[i]});
  for(const p of picks){if(HIST[p.week])continue;const g=games.find(x=>x.id===p.gameId);if(g&&res(g,p)==="hit"){const n=who(p.uid);t[n]=(t[n]||0)+p.pts}}
  if(me){const n=who(me.uid);t[n]??=0}return t}
function histData(){const H={};
  for(const w in HIST){H[w]={};for(const p in HIST[w])H[w][p]=HIST[w][p].map(([l,x])=>[l,!!x])}
  for(const p of picks){if(HIST[p.week])continue;const g=games.find(x=>x.id===p.gameId);if(!g||!locked(g))continue; // others' picks show only after kickoff
    const n=who(p.uid),r=res(g,p);((H[p.week]??={})[n]??=[null,null,null])[PTS.indexOf(p.pts)]=[label(g,p.side,p.line??g.spread),r==="hit"?true:r===null?null:false]}
  return H}
function gridCard(title,Hw,note){const ps=[...PLAYERS,...Object.keys(Hw).filter(p=>!PLAYERS.includes(p))];
  const cell=x=>x?`<div class="hc ${x[1]===true?"hitbg":""}">${esc(x[0])}${x[1]===null?' <span class="mu">…</span>':""}</div>`:`<div class="hc mu">–</div>`;
  const tot=p=>(Hw[p]||[]).reduce((s,x,i)=>s+(x&&x[1]===true?PTS[i]:0),0);
  return `<div class="card"><b>${title}</b>${note?`<div class="mu">${note}</div>`:""}<div class="hg" style="grid-template-columns:auto repeat(${ps.length},1fr)"><div></div>${ps.map(p=>`<div class="hh">${esc(p)}</div>`).join("")}${PTS.map((pt,i)=>`<div class="mu hl">${pt} pt</div>${ps.map(p=>cell((Hw[p]||[])[i])).join("")}`).join("")}<div class="mu hl">Total</div>${ps.map(p=>`<div class="hc tot">${tot(p)}</div>`).join("")}</div></div>`}
function vHist(){const H=histData(),ws=Object.keys(H).map(Number).sort((a,b)=>b-a);
  return ws.map(w=>gridCard("Week "+w,H[w])).join("")||'<div class="card mu">No past picks yet.</div>'}
// ---- Reveal rules (Eastern time) ----
const ETF=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});
const etp=ms=>Object.fromEntries(ETF.formatToParts(ms).map(x=>[x.type,x.value]));
const sunYmd=w=>{const s=games.filter(g=>g.week===w).map(g=>etp(kms(g))).filter(x=>x.weekday==="Sun").map(x=>`${x.year}-${x.month}-${x.day}`).sort()[0];
  return s||new Date(Date.UTC(2026,8,8,12)+((w-1)*7+5)*864e5).toISOString().slice(0,10)};
const HF=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",hour12:false});
const et=(ymd,h)=>{for(const o of["-04:00","-05:00"]){const t=new Date(`${ymd}T${String(h).padStart(2,"0")}:00:00${o}`);if(+HF.format(t)%24===h)return t.getTime()}};
function revealAt(p){const g=games.find(x=>x.id===p.gameId);if(!g)return Infinity;
  const y=sunYmd(p.week),s1=et(y,13),s4=et(y,16),k=kms(g);
  if(k<s1)return k;                                  // Thursday (or any pre-Sunday-1pm game): shown at that game's kickoff
  const at=p.at??0;return Math.min(k,at<s1?s1:Math.max(at,s4))} // made before Sun 1pm: shown 1pm; made later: shown 4pm (or right away after 4pm)
const visible=p=>p.uid===me.uid||Date.now()>=revealAt(p);
function liveGrid(){const Hw={};
  for(const p of picks){if(p.week!==week||!visible(p))continue;const g=games.find(x=>x.id===p.gameId);if(!g)continue;
    const r=res(g,p);(Hw[who(p.uid)]??=[null,null,null])[PTS.indexOf(p.pts)]=[label(g,p.side,p.line??g.spread),r==="hit"?true:r===null?null:false]}
  return gridCard(`Week ${week} picks`,Hw,"Thursday picks show at kickoff. Other picks show Sunday 1pm ET; picks made after 1pm show at 4pm.")}
const mine=()=>Object.fromEntries(picks.filter(p=>p.uid===me.uid&&p.week===week).map(p=>[p.gameId,p]));
const pd=(g,side,pts,line=g.spread,at=Date.now())=>({week:g.week,gameId:g.id,uid:me.uid,side,pts,line,at}); // line = home spread when picked; at = when first picked (used for reveal timing)
const pref=gid=>doc(db,"picks",gid+"_"+me.uid);
const err=e=>alert(/permission/i.test(e.message)?"Locked or not allowed.":e.message);
window.pick=async(gid,side)=>{const g=games.find(x=>x.id===gid),m=mine(),p=m[gid];if(locked(g))return;
  try{if(p?.side===side)await deleteDoc(pref(gid));else if(p)await setDoc(pref(gid),pd(g,side,p.pts,undefined,p.at));
  else{const f=[5,3,1].find(n=>!Object.values(m).some(x=>x.pts===n));if(!f)return alert("5, 3 and 1 are all used. Clear a pick first.");await setDoc(pref(gid),pd(g,side,f))}}catch(e){err(e)}};
window.setPts=async(gid,n)=>{const g=games.find(x=>x.id===gid),m=mine(),o=Object.values(m).find(x=>x.pts===n&&x.gameId!==gid),b=writeBatch(db);
  if(o){const og=games.find(x=>x.id===o.gameId);b.set(pref(o.gameId),pd(og,o.side,m[gid].pts,o.line??og.spread,o.at))}b.set(pref(gid),pd(g,m[gid].side,n,m[gid].line??g.spread,m[gid].at));try{await b.commit()}catch(e){err(e)}};
window.setTab=t=>{tab=t;render()};
function render(){if(!me)return;
  let h=`<nav>${[["standings","Standings"],["picks","Picks"],["history","History"]].map(([k,v])=>`<button class="${tab===k?"on":""}" onclick="setTab('${k}')">${v}</button>`).join("")}</nav>`;
  if(tab==="standings"){const r=Object.entries(totals()).sort((a,b)=>b[1]-a[1]);
    h+=r.map(([n,p],i)=>`<div class="card row"><div><div class="mu">${['🥇','🥈','🥉'][r.findIndex(x=>x[1]===p)]||'#'+(i+1)}</div><b>${esc(n)}</b></div><div class="big">${p}</div></div>`).join("")+liveGrid()}
  else if(tab==="history")h+=vHist();
  else{const gs=games.filter(g=>g.week===week).sort((a,b)=>kms(a)-kms(b)),m=mine();
    h+=`<div style="margin-bottom:10px"><b>Week ${week}</b></div>`;
    if(!gs.length)h+=`<div class="card mu">No lines yet for this week.</div>`;
    h+=`<div class="mu" style="margin-bottom:8px">${Object.keys(m).length}/3 picks. Use 5, 3 and 1 once each. Editable until kickoff.</div>`;
    for(const g of gs){const lk=locked(g),p=m[g.id],r=p&&res(g,p);
      h+=`<div class="card"><div class="row mu"><span>${esc(new Date(kms(g)).toLocaleString([],{weekday:"short",hour:"numeric",minute:"2-digit"}))}</span><span>${g.completed?`Final ${g.aScore}-${g.hScore}`:lk?"🔒 locked":""}</span></div>
      <div class="row" style="margin-top:8px">${["away","home"].map(s=>`<button class="side ${p?.side===s?"sel":""}" ${lk?"disabled":""} onclick="pick('${g.id}','${s}')">${logo(s==="home"?g.home:g.away)}${esc(label(g,s))}</button>`).join("")}</div>
      ${p&&p.line!=null&&p.line!==g.spread?`<div class="mu" style="margin-top:6px">Your pick is locked at ${esc(label(g,p.side,p.line))}</div>`:""}
      ${p?`<div class="pts"><span class="mu">Points</span>${[5,3,1].map(n=>`<button class="${p.pts===n?"on":""}" ${lk?"disabled":""} onclick="setPts('${g.id}',${n})">${n}</button>`).join("")}${r?`<span class="${r==="hit"?"hit":r==="miss"?"miss":"mu"}" style="margin-left:auto">${r==="hit"?"HIT +"+p.pts:r.toUpperCase()}</span>`:""}</div>`:""}</div>`}}
  A.innerHTML=h}
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{me=u;$("#out").hidden=!u;
  if(!u){A.innerHTML='<div class="card"><p>Sign in with your Gmail to play.</p><button class="btn" id="in">Sign in with Google</button></div>';$("#in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(err);return}
  setDoc(doc(db,"users",u.uid),{name:u.displayName||u.email});
  onSnapshot(collection(db,"users"),s=>{s.docs.forEach(d=>names[d.id]=d.data().name);render()},err);
  onSnapshot(collection(db,"games"),s=>{games=s.docs.map(d=>({id:d.id,...d.data()}));
    if(games.length){const open=games.filter(g=>!g.completed).map(g=>g.week);week=open.length?Math.min(...open):Math.max(...games.map(g=>g.week))}render()},err);
  onSnapshot(collection(db,"picks"),s=>{picks=s.docs.map(d=>d.data());render()},err);setInterval(render,30000)});
</script></body></html>
